<section id="menu">
  <div class="section-head">
    <span class="eyebrow">lo que más piden</span>
    <h2>Del menú</h2>
  </div>
  <div class="menu-grid">
    @for (item of items; track item.name) {
      <div class="menu-card">
        @if (item.tag) {
          <span class="tag">{{ item.tag }}</span>
        }
        <img class="thumb" [src]="item.imageSrc" [alt]="item.imageAlt" loading="lazy" decoding="async" width="400" height="220">
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
        <div class="price">{{ item.price }}</div>
      </div>
    }
  </div>
</section>
